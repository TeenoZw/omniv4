name: Deploy Production

on:
  workflow_dispatch:

concurrency:
  group: omni-v4-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-backend:
    name: Deploy Frappe backend
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out release
        uses: actions/checkout@v4

      - name: Configure production SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/omni_vps_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/omni_vps_ed25519 ~/.ssh/known_hosts

      - name: Create encrypted production backup
        run: |
          ssh -i ~/.ssh/omni_vps_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            deploy@13.140.144.28 'bash -se' <<'REMOTE'
          set -euo pipefail
          sudo systemctl start omniv4-backup.service
          while [ "$(sudo systemctl is-active omniv4-backup.service)" = "activating" ]; do
            sleep 2
          done
          test "$(sudo systemctl show omniv4-backup.service -p Result --value)" = "success"
          REMOTE

      - name: Upload release artifact
        run: |
          tar --exclude=.git -czf - . | ssh \
            -i ~/.ssh/omni_vps_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            deploy@13.140.144.28 \
            'sudo tar -xzf - -C /srv/omniv4/app'

      - name: Migrate, restart, and verify backend
        run: |
          ssh -i ~/.ssh/omni_vps_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            deploy@13.140.144.28 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /srv/omniv4/app
          cd deploy/vps
          sudo sed -i '/^ADMIN_PUBLIC_HOST=/d' .env
          echo 'ADMIN_PUBLIC_HOST=admin.omnilogistics.co.zw' | sudo tee -a .env >/dev/null
          sudo docker compose --env-file .env build backend
          sudo docker compose --env-file .env run --rm site-init
          sudo docker compose --env-file .env up -d --force-recreate --no-build \
            backend frontend websocket queue-short queue-long scheduler proxy

          cd /srv/omniv4/app
          ./deploy/vps/healthcheck.sh
          sudo docker exec vps-backend-1 \
            bench --site admin-v4.omnilogistics.co.zw execute \
            omni_operations.omni_setup.smoke.run_smoke_checks
          sudo docker exec vps-backend-1 \
            bench --site admin-v4.omnilogistics.co.zw execute \
            omni_operations.omni_setup.smoke.run_portal_api_smoke_checks
          REMOTE

      - name: Verify public production endpoint
        run: ./scripts/production_smoke_check.sh https://admin.omnilogistics.co.zw

      - name: Capture proxy diagnostics
        if: always()
        run: |
          ssh -i ~/.ssh/omni_vps_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            deploy@13.140.144.28 \
            'cd /srv/omniv4/app/deploy/vps && sudo docker compose --env-file .env logs --no-color --tail=120 proxy'
