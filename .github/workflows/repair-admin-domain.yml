name: Repair Admin Domain

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure production SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/omni_vps_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/omni_vps_ed25519 ~/.ssh/known_hosts

      - name: Reload production proxy hostname
        run: |
          ssh -i ~/.ssh/omni_vps_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            deploy@13.140.144.28 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /srv/omniv4/app/deploy/vps
          sudo sed -i '/^ADMIN_PUBLIC_HOST=/d' .env
          echo 'ADMIN_PUBLIC_HOST=admin.omnilogistics.co.zw' | sudo tee -a .env >/dev/null
          sudo docker compose --env-file .env up -d --force-recreate proxy
          sudo docker inspect vps-proxy-1 --format '{{range .Config.Env}}{{println .}}{{end}}' \
            | grep -E '^(ADMIN_PUBLIC_HOST|FRAPPE_SITE_NAME)='
          sudo docker exec vps-proxy-1 caddy adapt --config /etc/caddy/Caddyfile --pretty \
            | grep -F 'admin.omnilogistics.co.zw'
          REMOTE

      - name: Wait for production TLS
        run: |
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --max-time 10 \
              https://admin.omnilogistics.co.zw/api/method/ping | grep -q 'pong'; then
              exit 0
            fi
            sleep 10
          done
          exit 1
