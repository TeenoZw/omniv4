name: Deploy Production

on:
  workflow_dispatch:

concurrency:
  group: omni-v4-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-backend:
    name: Deploy Frappe backend
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Configure production SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/omni_vps_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/omni_vps_ed25519 ~/.ssh/known_hosts

      - name: Create encrypted production backup
        run: |
          ssh -i ~/.ssh/omni_vps_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            deploy@13.140.144.28 'bash -se' <<'REMOTE'
          set -euo pipefail
          sudo systemctl start omniv4-backup.service
          while [ "$(sudo systemctl is-active omniv4-backup.service)" = "activating" ]; do
            sleep 2
          done
          test "$(sudo systemctl show omniv4-backup.service -p Result --value)" = "success"
          REMOTE

      - name: Upload release artifact
        run: |
          tar --exclude=.git -czf - . | ssh \
            -i ~/.ssh/omni_vps_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            deploy@13.140.144.28 \
            'sudo tar -xzf - -C /srv/omniv4/app'

      - name: Migrate, restart, and verify backend
        run: |
          ssh -i ~/.ssh/omni_vps_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            deploy@13.140.144.28 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /srv/omniv4/app
          cd deploy/vps
          sudo sed -i '/^ADMIN_PUBLIC_HOST=/d' .env
          sudo sed -i '/^OMNIV4_IMAGE_TAG=/d' .env
          echo 'ADMIN_PUBLIC_HOST=admin.omnilogistics.co.zw' | sudo tee -a .env >/dev/null
          echo 'OMNIV4_IMAGE_TAG=${{ github.sha }}' | sudo tee -a .env >/dev/null
          export OMNIV4_IMAGE_TAG='${{ github.sha }}'
          sudo docker compose --env-file .env build backend
          sudo docker compose --env-file .env run --rm site-init
          sudo docker compose --env-file .env up -d --force-recreate --no-build \
            backend frontend websocket queue-short queue-long scheduler proxy

          sudo docker exec vps-backend-1 grep -q \
            'def get_current_technician_access_diagnostics' \
            /home/frappe/frappe-bench/apps/omni_operations/omni_operations/omni_security/access.py
          sudo docker exec vps-backend-1 \
            /home/frappe/frappe-bench/env/bin/python -c \
            "import omni_operations.omni_security.access as m; print(m.__file__); assert hasattr(m, 'get_current_technician_access_diagnostics')"

          cd /srv/omniv4/app
          ./deploy/vps/healthcheck.sh
          sudo docker exec vps-backend-1 \
            bench --site admin-v4.omnilogistics.co.zw execute \
            omni_operations.omni_setup.smoke.run_smoke_checks
          sudo docker exec vps-backend-1 \
            bench --site admin-v4.omnilogistics.co.zw execute \
            omni_operations.omni_setup.smoke.run_portal_api_smoke_checks
          technician_audit="$(sudo docker exec vps-backend-1 \
            bench --site admin-v4.omnilogistics.co.zw execute \
            omni_operations.omni_setup.smoke.run_technician_access_smoke_checks)"
          printf 'Technician access audit: %s\n' "$technician_audit"
          grep -Eq "('ok': True|\"ok\": true)" <<<"$technician_audit"
          REMOTE

      - name: Verify public production endpoint
        run: |
          ./scripts/production_smoke_check.sh https://admin.omnilogistics.co.zw
          diagnostic_response="$(curl -sS \
            'https://admin.omnilogistics.co.zw/api/method/omni_operations.omni_security.access.get_current_technician_access_diagnostics')"
          grep -q 'Authentication is required' <<<"$diagnostic_response"

      - name: Capture proxy diagnostics
        if: always()
        run: |
          ssh -i ~/.ssh/omni_vps_ed25519 \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            deploy@13.140.144.28 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /srv/omniv4/app/deploy/vps
          sudo docker compose --env-file .env ps
          for service in backend frontend proxy; do
            container="$(sudo docker compose --env-file .env ps -q "$service")"
            sudo docker inspect --format \
              '{{.Name}} image={{.Config.Image}} id={{.Id}} networks={{range .NetworkSettings.Networks}}{{.IPAddress}} {{end}}' \
              "$container"
          done
          sudo docker exec vps-frontend-1 getent hosts backend
          curl -sk --resolve admin.omnilogistics.co.zw:443:127.0.0.1 \
            'https://admin.omnilogistics.co.zw/api/method/omni_operations.omni_security.access.get_current_technician_access_diagnostics?source=localhost' \
            | head -c 1200
          printf '\n'
          sudo docker compose --env-file .env logs --no-color --tail=120 proxy
          REMOTE
